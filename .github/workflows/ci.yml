name: Verify native package
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.303
      - run: python -m pip install cmake==3.31.6
      - name: Verify Windows package and consumers
        shell: pwsh
        run: ./tools/Verify.ps1 -Generator 'Visual Studio 17 2022' -Toolset v143
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verified-windows
          path: artifacts/verify-*/
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-14, clang++-18]
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.303
      - run: python -m pip install --break-system-packages cmake==3.31.6
      - name: Verify Linux package with sanitizers
        shell: pwsh
        run: ./tools/Verify.ps1 -Generator Ninja -Sanitizers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verified-linux-${{ matrix.compiler }}
          path: artifacts/verify-*/
